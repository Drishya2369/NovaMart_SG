<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="800" height="620" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="800" height="52" fill="#1E293B" rx="12"/>
  <rect x="0" y="40" width="800" height="12" fill="#1E293B"/>
  <text x="400" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="700">CloudCart — Serverless Order Processing on AWS</text>

  <!-- Subtitle -->
  <text x="400" y="70" text-anchor="middle" fill="#64748B" font-size="11">Region: eu-west-1 (Ireland) · Python 3.11 · Phase 3 Complete ✅</text>

  <!-- ── PHASE LABELS ── -->
  <!-- Phase 1 band -->
  <rect x="16" y="82" width="768" height="18" rx="4" fill="#DBEAFE"/>
  <text x="400" y="95" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="700">PHASE 1 — Core Infrastructure</text>

  <!-- Phase 2 band -->
  <rect x="16" y="220" width="768" height="18" rx="4" fill="#DCFCE7"/>
  <text x="400" y="233" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">PHASE 2 — Serverless API</text>

  <!-- Phase 3 band -->
  <rect x="16" y="358" width="768" height="18" rx="4" fill="#FEF9C3"/>
  <text x="400" y="371" text-anchor="middle" fill="#854D0E" font-size="10" font-weight="700">PHASE 3 — Event-Driven Notifications</text>

  <!-- ══════════════════════════════════ -->
  <!-- PHASE 1 SERVICES -->
  <!-- ══════════════════════════════════ -->

  <!-- DynamoDB -->
  <rect x="60" y="108" width="130" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="60" y="108" width="130" height="28" rx="10" fill="#3B82F6"/>
  <rect x="60" y="122" width="130" height="14" fill="#3B82F6"/>
  <text x="125" y="127" text-anchor="middle" fill="white" font-size="11" font-weight="700">DynamoDB</text>
  <text x="125" y="152" text-anchor="middle" fill="#1E40AF" font-size="10">Orders Table</text>
  <text x="125" y="167" text-anchor="middle" fill="#1E40AF" font-size="10">eu-west-1</text>
  <text x="125" y="185" text-anchor="middle" fill="#3B82F6" font-size="18">🗄️</text>

  <!-- S3 -->
  <rect x="220" y="108" width="130" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="220" y="108" width="130" height="28" rx="10" fill="#3B82F6"/>
  <rect x="220" y="122" width="130" height="14" fill="#3B82F6"/>
  <text x="285" y="127" text-anchor="middle" fill="white" font-size="11" font-weight="700">Amazon S3</text>
  <text x="285" y="152" text-anchor="middle" fill="#1E40AF" font-size="10">cloudcart-orders</text>
  <text x="285" y="167" text-anchor="middle" fill="#1E40AF" font-size="10">-bucket</text>
  <text x="285" y="185" text-anchor="middle" fill="#3B82F6" font-size="18">🪣</text>

  <!-- IAM -->
  <rect x="380" y="108" width="130" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="380" y="108" width="130" height="28" rx="10" fill="#3B82F6"/>
  <rect x="380" y="122" width="130" height="14" fill="#3B82F6"/>
  <text x="445" y="127" text-anchor="middle" fill="white" font-size="11" font-weight="700">IAM</text>
  <text x="445" y="150" text-anchor="middle" fill="#1E40AF" font-size="10">LambdaOrderProcessor</text>
  <text x="445" y="164" text-anchor="middle" fill="#1E40AF" font-size="10">Role (Least Privilege)</text>
  <text x="445" y="185" text-anchor="middle" fill="#3B82F6" font-size="18">🔐</text>

  <!-- CloudWatch -->
  <rect x="540" y="108" width="130" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="540" y="108" width="130" height="28" rx="10" fill="#3B82F6"/>
  <rect x="540" y="122" width="130" height="14" fill="#3B82F6"/>
  <text x="605" y="127" text-anchor="middle" fill="white" font-size="11" font-weight="700">CloudWatch</text>
  <text x="605" y="152" text-anchor="middle" fill="#1E40AF" font-size="10">Logs &amp; Observability</text>
  <text x="605" y="167" text-anchor="middle" fill="#1E40AF" font-size="10">All Lambda invocations</text>
  <text x="605" y="185" text-anchor="middle" fill="#3B82F6" font-size="18">📊</text>

  <!-- ══════════════════════════════════ -->
  <!-- PHASE 2 SERVICES -->
  <!-- ══════════════════════════════════ -->

  <!-- Postman/Client -->
  <rect x="60" y="246" width="130" height="90" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <rect x="60" y="246" width="130" height="28" rx="10" fill="#22C55E"/>
  <rect x="60" y="260" width="130" height="14" fill="#22C55E"/>
  <text x="125" y="265" text-anchor="middle" fill="white" font-size="11" font-weight="700">Client</text>
  <text x="125" y="290" text-anchor="middle" fill="#166534" font-size="10">Postman</text>
  <text x="125" y="305" text-anchor="middle" fill="#166534" font-size="10">POST /order</text>
  <text x="125" y="323" text-anchor="middle" fill="#22C55E" font-size="18">💻</text>

  <!-- Arrow Client -> API GW -->
  <line x1="190" y1="291" x2="218" y2="291" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- API Gateway -->
  <rect x="220" y="246" width="130" height="90" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <rect x="220" y="246" width="130" height="28" rx="10" fill="#22C55E"/>
  <rect x="220" y="260" width="130" height="14" fill="#22C55E"/>
  <text x="285" y="265" text-anchor="middle" fill="white" font-size="11" font-weight="700">API Gateway</text>
  <text x="285" y="290" text-anchor="middle" fill="#166534" font-size="10">HTTP API</text>
  <text x="285" y="305" text-anchor="middle" fill="#166534" font-size="10">POST /order</text>
  <text x="285" y="323" text-anchor="middle" fill="#22C55E" font-size="18">🚪</text>

  <!-- Arrow API GW -> Lambda -->
  <line x1="350" y1="291" x2="378" y2="291" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- order_processor Lambda -->
  <rect x="380" y="246" width="150" height="90" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <rect x="380" y="246" width="150" height="28" rx="10" fill="#22C55E"/>
  <rect x="380" y="260" width="150" height="14" fill="#22C55E"/>
  <text x="455" y="265" text-anchor="middle" fill="white" font-size="11" font-weight="700">Lambda</text>
  <text x="455" y="288" text-anchor="middle" fill="#166534" font-size="10">order_processor</text>
  <text x="455" y="302" text-anchor="middle" fill="#166534" font-size="10">Python 3.11</text>
  <text x="455" y="323" text-anchor="middle" fill="#22C55E" font-size="18">⚡</text>

  <!-- Arrow Lambda -> DynamoDB (going up) -->
  <line x1="420" y1="246" x2="160" y2="198" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- ══════════════════════════════════ -->
  <!-- PHASE 3 SERVICES -->
  <!-- ══════════════════════════════════ -->

  <!-- Arrow Lambda -> SQS (going down) -->
  <line x1="455" y1="336" x2="455" y2="376" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- SQS Queue -->
  <rect x="60" y="384" width="150" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="60" y="384" width="150" height="28" rx="10" fill="#F59E0B"/>
  <rect x="60" y="398" width="150" height="14" fill="#F59E0B"/>
  <text x="135" y="403" text-anchor="middle" fill="white" font-size="11" font-weight="700">Amazon SQS</text>
  <text x="135" y="426" text-anchor="middle" fill="#92400E" font-size="10">cloudcart-order-queue</text>
  <text x="135" y="441" text-anchor="middle" fill="#92400E" font-size="10">Standard Queue</text>
  <text x="135" y="462" text-anchor="middle" fill="#F59E0B" font-size="18">📬</text>

  <!-- DLQ -->
  <rect x="240" y="384" width="150" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="240" y="384" width="150" height="28" rx="10" fill="#F59E0B"/>
  <rect x="240" y="398" width="150" height="14" fill="#F59E0B"/>
  <text x="315" y="403" text-anchor="middle" fill="white" font-size="11" font-weight="700">Dead Letter Queue</text>
  <text x="315" y="426" text-anchor="middle" fill="#92400E" font-size="10">cloudcart-order-dlq</text>
  <text x="315" y="441" text-anchor="middle" fill="#92400E" font-size="10">maxReceiveCount: 3</text>
  <text x="315" y="462" text-anchor="middle" fill="#F59E0B" font-size="18">🚨</text>

  <!-- Arrow SQS -> DLQ -->
  <line x1="210" y1="429" x2="238" y2="429" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <text x="224" y="422" text-anchor="middle" fill="#92400E" font-size="8">fail×3</text>

  <!-- Arrow SQS -> notification Lambda (going right) -->
  <line x1="455" y1="376" x2="455" y2="384" stroke="#F59E0B" stroke-width="2"/>
  <line x1="210" y1="429" x2="418" y2="429" stroke="#F59E0B" stroke-width="0"/>

  <!-- notification_handler Lambda -->
  <rect x="420" y="384" width="150" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="420" y="384" width="150" height="28" rx="10" fill="#F59E0B"/>
  <rect x="420" y="398" width="150" height="14" fill="#F59E0B"/>
  <text x="495" y="403" text-anchor="middle" fill="white" font-size="11" font-weight="700">Lambda</text>
  <text x="495" y="426" text-anchor="middle" fill="#92400E" font-size="10">notification_handler</text>
  <text x="495" y="441" text-anchor="middle" fill="#92400E" font-size="10">Triggered by SQS</text>
  <text x="495" y="462" text-anchor="middle" fill="#F59E0B" font-size="18">⚡</text>

  <!-- Arrow notification Lambda -> SNS -->
  <line x1="570" y1="429" x2="598" y2="429" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- SNS -->
  <rect x="600" y="384" width="150" height="90" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="600" y="384" width="150" height="28" rx="10" fill="#F59E0B"/>
  <rect x="600" y="398" width="150" height="14" fill="#F59E0B"/>
  <text x="675" y="403" text-anchor="middle" fill="white" font-size="11" font-weight="700">Amazon SNS</text>
  <text x="675" y="426" text-anchor="middle" fill="#92400E" font-size="10">cloudcart-notifications</text>
  <text x="675" y="441" text-anchor="middle" fill="#92400E" font-size="10">Email Subscription</text>
  <text x="675" y="462" text-anchor="middle" fill="#F59E0B" font-size="18">📢</text>

  <!-- Arrow SNS -> Email -->
  <line x1="675" y1="474" x2="675" y2="510" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Email -->
  <rect x="600" y="512" width="150" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="675" y="537" text-anchor="middle" fill="#92400E" font-size="11" font-weight="700">📧 Email Confirmation</text>
  <text x="675" y="555" text-anchor="middle" fill="#92400E" font-size="10">rajdrishya458@gmail.com</text>

  <!-- ══ SQS trigger arrow to notification_handler ══ -->
  <line x1="210" y1="429" x2="418" y2="429" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ══ Flow number labels ══ -->
  <circle cx="205" cy="280" r="10" fill="#1E293B"/>
  <text x="205" y="284" text-anchor="middle" fill="white" font-size="10" font-weight="700">1</text>

  <circle cx="365" cy="280" r="10" fill="#1E293B"/>
  <text x="365" y="284" text-anchor="middle" fill="white" font-size="10" font-weight="700">2</text>

  <circle cx="430" cy="242" r="10" fill="#1E293B"/>
  <text x="430" y="246" text-anchor="middle" fill="white" font-size="10" font-weight="700">3</text>

  <circle cx="460" cy="362" r="10" fill="#1E293B"/>
  <text x="460" y="366" text-anchor="middle" fill="white" font-size="10" font-weight="700">4</text>

  <circle cx="320" cy="420" r="10" fill="#1E293B"/>
  <text x="320" y="424" text-anchor="middle" fill="white" font-size="10" font-weight="700">5</text>

  <circle cx="590" cy="420" r="10" fill="#1E293B"/>
  <text x="590" y="424" text-anchor="middle" fill="white" font-size="10" font-weight="700">6</text>

  <!-- ══ Legend ══ -->
  <rect x="16" y="496" width="560" height="100" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="30" y="514" fill="#475569" font-size="10" font-weight="700">Flow:</text>
  <text x="30" y="530" fill="#475569" font-size="10">① Client sends POST /order via Postman</text>
  <text x="30" y="545" fill="#475569" font-size="10">② API Gateway routes to order_processor Lambda</text>
  <text x="30" y="560" fill="#475569" font-size="10">③ Lambda saves order to DynamoDB</text>
  <text x="290" y="530" fill="#475569" font-size="10">④ Lambda pushes message to SQS Queue</text>
  <text x="290" y="545" fill="#475569" font-size="10">⑤ SQS triggers notification_handler Lambda</text>
  <text x="290" y="560" fill="#475569" font-size="10">⑥ Lambda publishes to SNS → Email delivered</text>
  <text x="30" y="582" fill="#94A3B8" font-size="9">Failed messages retry 3× then move to DLQ · All Lambdas log to CloudWatch · IAM least privilege enforced</text>

  <!-- Markers -->
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>
